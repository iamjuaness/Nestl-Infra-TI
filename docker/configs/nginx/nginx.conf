events {
    worker_connections 1024;
}

http {
    upstream web_backend {
        least_conn;
        server web_primary:80 weight=5 max_fails=3 fail_timeout=30s;
        server web_secondary:80 weight=5 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;
        server_name localhost nestle.local _;  # ← Acepta localhost
        
        location / {
            proxy_pass http://web_backend;      # ← Va directo a los web servers
        }
    }

    server {
        listen 443 ssl http2;
        server_name nestle.local;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nestle.crt;
        ssl_certificate_key /etc/nginx/ssl/nestle.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Rate limiting
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

        # Servidor para métricas stub_status (solo interno)
    server {
        listen 8080;
        server_name localhost;
        
        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.20.0.0/16;  # Permitir red Docker
            deny all;
        }
    }
}
